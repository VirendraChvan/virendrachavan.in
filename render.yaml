services:
  - type: web
    name: virendra-portfolio
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      # Render will ask you for these two secret values in the dashboard!
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
